[project]
name = "xgboost-mastery"
version = "0.1.0"
description = "A comprehensive, end-to-end guide and project repository for mastering XGBoost."
readme = "README.md"
requires-python = ">=3.9, <3.13"
dependencies = [
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "yfinance>=0.2.0",
    "shap>=0.43.0",
    "optuna>=3.3.0",
    "optuna-integration>=3.6.0",
    "kaggle>=1.5.16",
    "onnxruntime>=1.16.0",
    "skl2onnx>=1.15.0",
    "openpyxl>=3.1.0",
    "markdown>=3.4.0",
    "joblib>=1.3.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[project.optional-dependencies]
distributed = [
    "pyspark>=3.5.0",
    "dask[complete]>=2023.9.0",
    "ray[default]>=2.7.0",
    "xgboost-ray>=0.1.16",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

